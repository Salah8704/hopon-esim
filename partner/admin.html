<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HopOn Admin — Partenaires</title><style>body{margin:0;background:#071a34;color:#eef5ff;font:14px system-ui}main{max-width:1180px;margin:auto;padding:35px}h1{font-size:32px}.bar{display:flex;justify-content:space-between;align-items:center}.card{background:#0d2747;border:1px solid #244463;border-radius:16px;padding:20px;margin:18px 0;overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:12px;text-align:left;border-bottom:1px solid #244463}th{color:#9fb4ca;font-size:11px;text-transform:uppercase}button,select,input{font:inherit;border-radius:8px;padding:8px 10px;border:1px solid #355676;background:#0a203d;color:white}button{background:#f28c28;color:#071a34;font-weight:700;cursor:pointer}.muted{color:#9fb4ca}.pill{padding:4px 8px;border-radius:20px;background:#173b60}.login{max-width:400px;margin:12vh auto}label{display:block;margin:12px 0 5px}.login input{width:100%;box-sizing:border-box;padding:12px}.login button{width:100%;margin-top:16px;padding:12px}</style></head><body>
<main><section id="login" class="card login"><h1>Administration partenaires</h1><form><label>E-mail</label><input id="email" type="email" required><label>Mot de passe</label><input id="password" type="password" required><button>Se connecter</button><p id="error"></p></form></section><section id="app" hidden><div class="bar"><div><div class="muted">HOPON ADMIN</div><h1>Partenaires & commissions</h1></div><button onclick="logout()">Déconnexion</button></div><div class="card"><h2>Comptes partenaires</h2><table><thead><tr><th>Partenaire</th><th>Profil</th><th>Code</th><th>Ventes</th><th>Commission</th><th>Réglage</th><th>Statut</th><th></th></tr></thead><tbody id="partners"></tbody></table></div><div class="card"><h2>Ventes attribuées</h2><table><thead><tr><th>Date</th><th>Partenaire</th><th>Vente</th><th>Commission</th><th>Source</th><th>Statut</th><th></th></tr></thead><tbody id="referrals"></tbody></table></div></section></main>
<script>const BASE=(window.HOPON_API_URL||'https://api.hopon.fr')+'/api/v1/admin';let token=localStorage.getItem('hopon_admin_token');async function api(path,opt={}){const r=await fetch(BASE+path,{...opt,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,...(opt.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Erreur');return d}document.querySelector('form').onsubmit=async e=>{e.preventDefault();try{const d=await fetch(BASE+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})}).then(r=>r.json());if(!d.token)throw Error(d.error);token=d.token;localStorage.setItem('hopon_admin_token',token);load()}catch(x){error.textContent=x.message}};function money(v,c='EUR'){return new Intl.NumberFormat('fr-FR',{style:'currency',currency:c||'EUR'}).format(Number(v||0))}async function load(){try{const [p,r]=await Promise.all([api('/partners'),api('/partner-referrals')]);login.hidden=true;app.hidden=false;partners.innerHTML=p.partners.map(x=>`<tr><td><b>${x.name}</b><br><span class="muted">${x.email}</span></td><td>${x.type}</td><td>${x.partner_code}</td><td>${x.sales}</td><td>${money(x.commission)}</td><td><select id="ct-${x.id}"><option value="percentage" ${x.commission_type==='percentage'?'selected':''}>Pourcentage</option><option value="fixed" ${x.commission_type==='fixed'?'selected':''}>Fixe</option></select> <input id="cv-${x.id}" type="number" min="0" step="0.01" value="${x.commission_type==='fixed'?x.commission_fixed:x.commission_pct}" style="width:70px"></td><td><select id="st-${x.id}">${['pending','active','suspended','terminated'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></td><td><button onclick="savePartner('${x.id}')">Enregistrer</button></td></tr>`).join('');referrals.innerHTML=r.referrals.map(x=>`<tr><td>${new Date(x.created_at).toLocaleDateString('fr-FR')}</td><td>${x.partner_name}<br><span class="muted">${x.partner_code}</span></td><td>${money(x.sale_amount,x.currency)}</td><td>${money(x.commission_amount,x.currency)}</td><td>${x.source||'—'}</td><td><select id="rs-${x.id}">${['pending','validated','paid','cancelled'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></td><td><button onclick="saveReferral('${x.id}')">Valider</button></td></tr>`).join('')}catch(e){logout()}}async function savePartner(id){const type=document.getElementById('ct-'+id).value,value=Number(document.getElementById('cv-'+id).value);await api('/partners/'+id,{method:'PATCH',body:JSON.stringify({status:document.getElementById('st-'+id).value,commission_type:type,commission_pct:type==='percentage'?value:0,commission_fixed:type==='fixed'?value:0})});load()}async function saveReferral(id){await api('/partner-referrals/'+id,{method:'PATCH',body:JSON.stringify({status:document.getElementById('rs-'+id).value})});load()}function logout(){localStorage.removeItem('hopon_admin_token');location.reload()}if(token)load();</script></body></html>
